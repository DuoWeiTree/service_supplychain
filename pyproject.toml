[project]
name = "jxd-scm"
version = "0.1.0"
description = "供应链后端服务 —— 销售计划 → 采购单 → 排货 → 投送 → 回执"
requires-python = ">=3.11"          # tomllib
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg2-binary>=2.9",
    "clickhouse-connect==1.5.0",
    "apscheduler==3.11.3",
    "cryptography>=43",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
# httpx 是 starlette.testclient 的运行期依赖，只测试用。
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# ★ 只加仓库根到 sys.path，不动 tests/ 本身已有的插入行为（helpers.py 等仍按
#   旧方式扁平导入）——Task 4 的 `from tests.fixtures import ch_rows` 需要
#   根目录可见，`tests/` 没有 __init__.py 时 pytest 默认只把 tests/ 自己
#   插进 sys.path，够不到它的父目录。
pythonpath = ["."]
markers = [
    "pure: 不连 PG / CH / 领星，离线可跑（tests/conftest.py 按夹具自动归类）",
    "integration: 要连 PG / CH / 领星（用到 business_db，或文件里显式标注）",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "api.common", "api.ui", "dim", "erp", "erp.drivers", "forecast", "jobs",
            "migrations", "migrations.pg", "repo", "rules", "shared", "usecase"]

[tool.ruff]
line-length = 100
# ★ docs/prototype/ 是已冻结的老原型（CLAUDE.md：只作参考，不再修）。
#   它贡献的 14 条 lint 谁都不许去改，留着只会让「ruff 默认是红的」变成常态，
#   而一个默认红的门禁没有人会再去读。
exclude = ["docs/prototype"]
