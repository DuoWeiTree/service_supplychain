# service_supplychain 连接配置。本文件不入库；模板是 config.example.toml。
# 路径可由环境变量 JXD_SCM_CONFIG 覆盖（测试用它指向 scm_test）。

[business_pg]                # ★ 业务库：本仓全部业务数据，独占 schema scm
host     = "192.168.66.210"
port     = 5432
user     = "postgres"
password = "YOUR_PG_PASSWORD"
dbname   = "jxd_ml"
schema   = "scm"             # ★ 测试时被切到 scm_test；禁止 scm / inv

[clickhouse]                 # ★ 只读。jxd 数据中心的采集副本，绝不写
host     = "192.168.66.211"
port     = 8123
user     = "default"
password = "YOUR_CH_PASSWORD"
database = "jxd_raw"
secure   = false

[api]
# ★ 阶段 A 按 Q-5 内网裸跑，不做鉴权；这一段留给 api/pub/ 上线时用。
bind = "0.0.0.0"
port = 8091

[freshness]
# ★ 维度镜像陈旧超过它 → 拒绝服务（E-4）。
# ★ 设计取值 · 未实测 —— 文档没给过阈值（OQ-7）。
max_age_hours = 24

# ★ 进程内 APScheduler 每日刷一次的时刻（负责人裁定 S-33）。
#   07:481「在 CH 采集窗口之后」——「之后」是文档原话，06:30 是设计取值 · 未实测（OQ-7）。
refresh_at       = "06:30"
refresh_timezone = "Asia/Shanghai"   # ★ 容器里的本地时区不可靠，必须显式写（OQ-10）

# ★ false = 不起调度器（测试、只跑 CLI 的部署）。关着时启动日志里有一条 WARNING。
scheduler_enabled = true

# ★ 本轮行数较上一次成功轮跌幅超过它 → 拒绝整批、保留旧镜像（07:485）。
#   设计取值 · 未实测（OQ-6 裁定 09-22 = 0.30；邻仓实测单日掉 40% 是坏批）。
coverage_drop_threshold = 0.30

# ★ 启动钩子只记录 + 触发刷新，不拦启动、不拦 /health · /v1/readiness；
#   真正的拒绝服务只在业务路由按请求判（OQ-8 裁定 09-22，见 03:1622）。
#   测试夹具置 false —— 它 TRUNCATE 掉四张镜像。
startup_gate = true

[forecast]
# ★ 阶段 A 取数源。"fixture" = tests/fixtures 的 5 个假 msku（离线可跑）；
#   "ch" = 真 ClickHouse。默认 fixture —— 漏配不该变成「去连生产」。
source = "fixture"

# 快照日候选窗口，以及「这批采集算写完了」的静置时长。
# ★ 实测：lingxing_inventory_fba_detail 当天 06:34~07:39 起跑、约 60 秒跑完，
#   而 [freshness] refresh_at = "06:30" 排在它之前 —— 半写窗口真实存在。
snapshot_lookback_days  = 7
snapshot_settle_minutes = 30

# ChSource 内部缓存：快照批次按采集日缓存（同一天的快照不可变），
# as_of 的解析结果按这个秒数缓存。
cache_ttl_seconds = 300

# 一次最多回溯多少个完整自然月。
sales_months_max = 24

# 掉档阈值。★ 实测该表日间波动 < 2%、每日恰好 21 个 sid，所以 0.30 已经很松。
drop_threshold = 0.30

# 绝对地板：纯粹「比对相邻候选日」测不出「整窗口同步塌陷」——如果连续几天
# 都只写回同样少的行数，相邻两日互相看起来完全没「掉」。这两个数字不随
# 候选集本身浮动，是最后一道底线。
# ★ 实测出处：SQL_FBA_CAPTURE_DAYS（dim/ch_source.py）对
#   jxd_raw.lingxing_inventory_fba_detail 近 20 个采集日的查询（design §1.3
#   E-1，2026-09-23，控制器实测）——行数 7,934~8,080，uniq(sid) 恒为 21。
#   取区间下限；业务量级变了要重新实测，不是拍脑袋改数字。
min_rows         = 7934
min_distinct_sid = 21

# 采购单快照的陈旧阈值：超过这么多天没有新采集日，整批在途视为「未知」而不是 0。
# ★ 实测两表（purchase_order_list / _items）比 fba_detail 晚 1 天是常态；3 天留出
#   「漏采一天仍可用、漏采两天就该报警」的余量（design §8 OQ-5）。
purchase_staleness_days = 3
