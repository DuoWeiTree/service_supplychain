# service_supplychain 连接配置。本文件不入库；模板是 config.example.toml。
# 路径可由环境变量 JXD_SCM_CONFIG 覆盖（测试用它指向 scm_test）。

[business_pg]                # ★ 业务库：本仓全部业务数据，独占 schema scm
host     = "192.168.66.210"
port     = 5432
user     = "postgres"
password = "YOUR_PG_PASSWORD"
dbname   = "jxd_ml"
schema   = "scm"             # ★ 测试时被切到 scm_test；禁止 scm / inv

[clickhouse]                 # ★ 只读。jxd 数据中心的采集副本，绝不写
host     = "192.168.66.211"
port     = 8123
user     = "default"
password = "YOUR_CH_PASSWORD"
database = "jxd_raw"
secure   = false

[api]
# ★ 阶段 A 按 Q-5 内网裸跑，不做鉴权；这一段留给 api/pub/ 上线时用。
bind = "0.0.0.0"
port = 8090

[freshness]
# ★ 维度镜像陈旧超过它 → 拒绝服务，但拒绝只发生在业务路由按请求判（OQ-8 裁定 09-22）——
#   启动钩子本身不拦服务、也不拦 /health · /v1/readiness，只记录 + 触发一次立即刷新。
# ★ 设计取值 · 未实测 —— 文档没给过阈值（mirror-refresh 设计 §10 OQ-7）。
max_age_hours = 24

# ★ 进程内 APScheduler 每日刷一次的时刻（负责人裁定 S-33）。
#   07:481「在 CH 采集窗口之后」——「之后」是文档原话，06:30 是设计取值 · 未实测（OQ-7）。
refresh_at       = "06:30"
# ★ 容器里的本地时区不可靠，必须显式写：06:30 落在 UTC 上就是北京时间 14:30，
#   正好在采集窗口中间 —— 而那样每天都拿半批数据，看起来完全正常（OQ-10 裁定 09-22）。
refresh_timezone = "Asia/Shanghai"

# ★ false = 不起调度器（测试、只跑 CLI 的部署）。
#   关着时启动日志里有一条 WARNING —— 静默不启动与启动了长得一样。
scheduler_enabled = true

# ★ 本轮行数较上一次成功轮跌幅超过它 → 拒绝整批、保留旧镜像（07:485）。
# ★ 设计取值 · 未实测（OQ-6 裁定 09-22 = 0.30）：邻仓实测库存日报单日掉约 40% 是坏批，
#   取比它更松的阈值，免得把 30% 内的正常波动也当掉档拒了。
coverage_drop_threshold = 0.30

# ★ 启动时维度镜像仍陈旧时的记录行为（OQ-8 裁定 09-22：不拦启动、不拦健康检查，
#   只记日志 + 触发一次立即刷新；真正的拒绝服务在业务路由逐请求 503）。
#   测试夹具置 false —— 它 TRUNCATE 掉四张镜像。
startup_gate = true
